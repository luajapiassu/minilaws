[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minilaws"
version = "0.2.0"
description = "Curry-Howard for AI-edited Python: the AI writes code and proofs, a tiny kernel checks them, the laws stay human-owned"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lua Japiassu" }]
keywords = ["proof-checking", "dependent-types", "verification", "ai-safety", "pytest"]
classifiers = ["Framework :: Pytest", "Topic :: Software Development :: Testing"]

[project.urls]
Repository = "https://github.com/luajapiassu/minilaws"

[project.scripts]
minilaws = "minilaws:cli"

[project.entry-points.pytest11]
minilaws = "pytest_minilaws"

[tool.setuptools]
py-modules = ["minilaws", "pytest_minilaws"]
